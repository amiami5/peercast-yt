[package]
name = "peercast-rs"
version = "0.1.0"
edition = "2021"
# 確認した最も古い Rust (Ubuntu などの配布版の rustc でもビルドできるようにする)
rust-version = "1.70"
description = "PeerCast YT のサーバー (Rust 版)"
license = "GPL-2.0-or-later"
publish = false

# 外部クレートには依存しない (サプライチェーンの面積を増やさないため)。
[dependencies]

[features]
# 入力元の rtmp:// を librtmp で読む
rtmp = []

[lib]
name = "peercast_rs"
path = "src/lib.rs"

[[bin]]
name = "peercast"
path = "src/bin/peercast.rs"
