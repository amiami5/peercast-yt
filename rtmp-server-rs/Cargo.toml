[package]
name = "rtmp-server"
version = "0.1.0"
edition = "2021"
description = "PeerCast YT の rtmp-server (RTMP で配信を受け付けて PeerCast に流す)"
license = "GPL-2.0-or-later"
publish = false

# 外部クレートには依存しない (サプライチェーンの面積を増やさないため)。
[dependencies]

[lib]
name = "rtmpserver"
path = "src/lib.rs"

[[bin]]
name = "rtmp-server"
path = "src/main.rs"
