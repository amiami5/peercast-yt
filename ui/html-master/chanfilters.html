{^define LAYOUT layout.html}
{^define TITLE}
  {#Channel Filters} - {#PeerCast on} {^SERVER_NAME}
{^end}
{^define HEAD}
  <style>
  </style>
{^end}

<!-- who etc. -->
<script src="/assets/js/render_helpers.js"></script>

<script>
  let Filters

  function backgroundStyle(colors)
  {
      if (colors.length == 0)
          return "transparent"
      else
          return "linear-gradient(95deg, rgba(255,255,255,0), " + colors.map(triple => `rgba(${triple.join(", ")},0.75)`).join(", ")
  }

  function renderFilterTable()
  {
      const renderOptionalSearch = (search => search.enabled ? search.search : ["span", "<{#Disabled}>"])

      document.getElementById('filter_table').innerHTML = who(
          ['table', { class: 'table-panel', style: "width: 100%" },
           ['tr',
            ['th', '{#Enabled}' ],
            ['th', '{#Filter Name}'],
            ['th', '{#Base Search}'],
            ['th', '{#AND Search}'],
            ['th', '{#NOT Search}']],

           ... Filters.map((f, index) => [
               'tr', { style: f.enable_color ? `background: ${backgroundStyle([f.color])}` : "" },
               ['td', { style: 'text-align: center' }, ['input', { type: 'checkbox', checked: f.enabled, onchange: `Filters[${index}].enabled = this.checked; saveChannelFiltersAsync()` }]],
               ['td', { onclick: `showFilterModal(${index})`, style: 'cursor: pointer' }, f.name],
               ['td', { onclick: `showFilterModal(${index}, 1)`, style: 'cursor: pointer' }, f.base_search.search],
               ['td', { onclick: `showFilterModal(${index}, 2)`, style: 'cursor: pointer' }, renderOptionalSearch(f.and_search)],
               ['td', { onclick: `showFilterModal(${index}, 3)`, style: 'cursor: pointer' }, renderOptionalSearch(f.base_search)],
           ]),
          ],
          ['button', { onclick: 'showFilterModal(-1)' }, "\u2795 {#Add}"],
      )
  }

  function selectTab(index)
  {
      for (const tab of document.querySelectorAll('#search_tabset a'))
          tab.classList.remove('active-tab')
      document.querySelector(`#search_tabset a:nth-child(${index})`).classList.add('active-tab')

      for (const pane of document.querySelectorAll('.search-pane'))
          pane.style.display = 'none'

      if (index == 1)
      {
          document.getElementById('base_search_pane').style.display = ''
      }else if (index == 2)
      {
          document.getElementById('and_search_pane').style.display = ''
      }else if (index == 3)
      {
          document.getElementById('not_search_pane').style.display = ''
      }
  }

  function toHashNotation(color)
  {
      return "#" + color.map(n => {
          const hex = n.toString(16)
          return new Array(2 - hex.length + 1).join('0') + hex
      }).join("")
  }

  function toTriples(hash)
  {
      const arr = /^#(..)(..)(..)/.exec(hash)
      if (arr)
      {
          return arr.slice(1).map(s => Number.parseInt(s, 16))
      }else
          throw new Error("toTriples: Format error")
  }

  let filterIndex

  function showFilterModal(index, tabIndex)
  {
      let f

      if (index === -1)
      {
          f = newFilter()
      }
      else
      {
          f = Filters[index]

          if (!f)
          {
              console.error("Filter index out of range")
              return;
          }
      }
      filterIndex = index

      const fields = [
          ['name',           '{#Channel Name}'],
          ['genre',          '{#Genre}'],
          ['desc',           '{#Description}'],
          ['comment',        '{#Comment}'],
          ['trackArtist',    '{#Artist}'],
          ['trackName',      '{#Title}'],
          ['trackAlbum',     '{#Album}'],
          ['feedUrl',        '{#Feed URL}'],
          ['url',            '{#Contact URL}'],
          ['trackContact',   '{#Track URL}'],
          ['contentTypeStr', '{#Type}'],
          ['status',         '{#Status}'],
          ['id',             '{#Channel ID}'],
          ['tip',            '{#Tracker}'],
      ]

      const swabStyle = `background-color: rgb(${f.color[0]},${f.color[1]},${f.color[2]})`
      document.querySelector('#filter_modal #info').innerHTML = who(
          ['label',
           ['input', { id: "main_enabled_checkbox", type: 'checkbox', name: 'enabled', checked: f.enabled }],
           '{#Enabled}'],
          ['div',
           ['label', '{#Filter Name}: '],
           ['input', { type: 'text', name: 'name', value: f.name }]],
          ['div',
           ['label',
            ['input', { type: 'checkbox', name: 'favorite', checked: f.favorite }],
            '{#Add to Favorites}'],
           ['label',
            ['input', { type: 'checkbox', name: 'ignore', checked: f.ignore }],
            '{#Ignore}'],
          ],
          ['div', { class: 'flex-container navbar', style: 'margin-bottom:0', id: 'search_tabset' }, 
           ... ['{#Base Search}', '{#AND Search}', '{#NOT Search}'].map((text, index) =>
               ['a', { class: 'tab', onclick: `selectTab(${index+1})` }, text])
          ],
          ['div', { style: 'background-color: var(--bg-color-l2); padding: 0 8px 4px 8px' },

           // ----------------------------------------------------------------------------
           ['div', { class: 'search-pane', id: 'base_search_pane' },
            ['label', { style: 'display:block' }, ['input', { id: 'base_search_checkbox', type: 'checkbox', checked: true, disabled: true }], '{#Enabled}'],
            ['label', '{#Regular Expression}: ', ['input', { type: 'text', name: 'search', value: f.base_search.search }]],
            ['div',
             ... fields.map(([field, human_readable]) =>
                 ['label', { style: 'display:inline-block' }, ['input', { type: 'checkbox', name: "fields", value: field, checked: f.base_search.fields.includes(field) }], human_readable])]],

           // ----------------------------------------------------------------------------
           ... ['and', 'not'].map(kind =>
               ['div', { class: 'search-pane', id: `${kind}_search_pane` },
                ['label', { style: 'display:block' }, ['input', { name: 'enabled', type: 'checkbox', checked: f[`${kind}_search`].enabled }], '{#Enabled}'],
                ['label', '{#Regular Expression}: ', ['input', { type: 'text', name: 'search', value: f[`${kind}_search`].search }]],
                ['div',
                 ... fields.map(([field, human_readable]) =>
                     ['label', { style: 'display:inline-block' }, ['input', { type: 'checkbox', name: "fields", value: field, checked: f[`${kind}_search`].fields.includes(field) }], human_readable])]]),
          ],
          ['div',
           ['label',
            ['input', { name: 'ignore_case' , type: 'checkbox', checked: f.ignore_case }],
            '{#Ignore Case}',
           ],
          ],
          ['label',
           ['input', { name: "enable_color", type: 'checkbox', checked: f.enable_color }],
           '{#Background Color}',
           ['input', { name: "color", type: 'color', value: toHashNotation(f.color), style: 'margin-top: 10px' }]
          ]
      )

      selectTab(tabIndex || 1)

      document.getElementById('filter_modal').style.display = 'block'
  }

  function newFilter()
  {
      return {
          "enabled": true,
          "name": "{#New Filter}",
          "favorite": true,
          "ignore": false,
          "base_search":
          {
              "fields": ["name"],
              "search": "",
          },
          "and_search":
          {
              "enabled": false,
              "fields": [],
              "search": "",
          },
          "not_search":
          {
              "enabled": false,
              "fields": [],
              "search": "",
          },
          "ignore_case": true,
          "enable_color": false,
          "color": [0,0,0],
      }
  }

  function readModalFilterSettings()
  {

      return {
          "enabled": document.querySelector('#filter_modal #info #main_enabled_checkbox').checked,
          "name": document.querySelector('#filter_modal #info input[name=name]').value,
          "favorite": document.querySelector('#filter_modal #info input[name=favorite]').checked,
          "ignore": document.querySelector('#filter_modal #info input[name=ignore]').checked,
          "base_search":
          {
              "fields": Array.from(document.querySelectorAll('#base_search_pane input[name=fields]')).flatMap(e => e.checked ? [e.value] : []),
              "search": document.querySelector('#base_search_pane input[name=search]').value,
          },
          "and_search":
          {
              "enabled": document.querySelector('#and_search_pane input[name=enabled]').checked,
              "fields": Array.from(document.querySelectorAll('#and_search_pane input[name=fields]')).flatMap(e => e.checked ? [e.value] : []),
              "search": document.querySelector('#and_search_pane input[name=search]').value,
          },
          "not_search":
          {
              "enabled": document.querySelector('#not_search_pane input[name=enabled]').checked,
              "fields": Array.from(document.querySelectorAll('#not_search_pane input[name=fields]')).flatMap(e => e.checked ? [e.value] : []),
              "search": document.querySelector('#not_search_pane input[name=search]').value,
          },
          "ignore_case": document.querySelector('#filter_modal #info input[name=ignore_case]').checked,
          "enable_color": document.querySelector('#filter_modal #info input[name=enable_color]').checked,
          "color": toTriples(document.querySelector('#filter_modal #info input[name=color]').value),
      }
  }

  function onFilterModalOk()
  {
      if (filterIndex === -1)
          Filters.push(readModalFilterSettings())
      else          
          Filters[filterIndex] = readModalFilterSettings()

      renderFilterTable()
      document.getElementById('filter_modal').style.display = 'none'
      return saveChannelFiltersAsync()
  }

  async function saveChannelFiltersAsync()
  {
      try {
          await peercast("setServerStorageItem", "channelFilters", JSON.stringify(Filters))
          console.log("filters saved")
      } catch (e) {
          console.error(e)
      }
  }

  async function onFilterResetAsync()
  {
      if (confirm("{#Are you sure you want to clear all filter settings?}")) {
          Filters = []
          await saveChannelFiltersAsync()
          location.reload()
      }
  }

  async function main()
  {
      try {
          const data = await peercast("getServerStorageItem", "channelFilters")
          if (data)
              Filters = JSON.parse(data)
          else
              Filters = []
          renderFilterTable()
      } catch(error) {
          console.error(error)
          document.querySelector('#flash').textContent = `${error.name}: ${error.message}`
      }

      if (new URLSearchParams(window.location.search).get("fav"))
      {
          const chname = new URLSearchParams(window.location.search).get("fav")
          showFilterModal(-1)
          document.querySelector('#filter_modal #info input[name=name]').value = chname
          document.querySelector('#filter_modal #info #base_search_pane input[name=search]').value = chname.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&') // escape regexp
      }
  }

  function onFilterModalDelete()
  {
      f = Filters[filterIndex]

      const left = Filters.slice(0, filterIndex)
      const right = Filters.slice(filterIndex + 1)
      Filters = left.concat(right)
      document.getElementById('filter_modal').style.display = 'none'
      renderFilterTable()
      saveChannelFiltersAsync()
  }

  function onFilterModalReorder()
  {
      document.querySelector('#reorder_modal .modal-body').innerHTML = who(
          ['span', "{#New Place}:"],
          ['input', { type: "number", id: "new_place_input", value: (filterIndex + 1).toString(), min: "1", max: Filters.length.toString() }]
      )
      document.getElementById('reorder_modal').style.display = 'block'
  }

  function onReorderModalOk()
  {
      f = Filters[filterIndex]

      const left = Filters.slice(0, filterIndex)
      const right = Filters.slice(filterIndex + 1)
      Filters = left.concat(right)

      const newPlace = +document.querySelector('#reorder_modal #new_place_input').value - 1
      Filters.splice(newPlace, 0 /*deleteCount*/, f)

      document.getElementById('reorder_modal').style.display = 'none'
      document.getElementById('filter_modal').style.display = 'none'
      renderFilterTable()
      saveChannelFiltersAsync()
  }

  document.addEventListener('DOMContentLoaded', function(){
      main()
  })

</script>

<script>
  function toFields(search)
  {
      // Filter.xml -> YP
      const table =
          [
              ['channelName',     'name'],
              ['genre',           'genre'],
              ['detail',          'desc'],
              ['comment',         'comment'],
              ['artist',          'trackArtist'],
              ['title',           'trackName'],
              ['album',           'trackAlbum'],
              ['ypUrl',           'feedUrl'],
              ['contactUrl',      'url'],
              ['trackContactUrl', 'trackContact'],
              ['type',            'contentTypeStr'],
              ['status',          'status'],
              ['id',              'id'],
              ['tip',             'tip'],
          ]

      const fields = []
      const normal = search.querySelector("normal").attributes
      const extra = search.querySelector("extra").attributes

      for (const [from, to] of table)
      {
          let attr = normal.getNamedItem(from)
          if (!attr)
          {
              attr = extra.getNamedItem(from)
              if (!attr)
                  throw new Error(`${from} attribute not found`)
          }

          if (attr.value == "true")
              fields.push(to)
      }
      return fields
  }

  function integerToTriples(n)
  {
      let r, g, b
      b = n >> 16
      g = (n & 0xffff) >> 8
      r = n & 0xff
      return [r, g, b]
  }

  let ImportingFilters

  async function onFilterXmlInput()
  {
      const file = document.querySelector("#filter_xml").files[0]
      console.log(file)

      if (!file)
      {
          document.querySelector('#import_modal output').textContent = "{#Please select the Filter.xml file in your PeCaRecorder folder.}"
          ImportingFilters = undefined
          document.querySelector('#import_modal #ok_button').disabled = true
          return
      }

      try {
          const text = await file.text()
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(text, "application/xml");

          console.log(xmlDoc)
          const items = Array.from(xmlDoc.getElementsByTagName('item'))
          const filters =
              items.map(item => {
                  const f = newFilter()
                  f.enabled = (item.getAttribute('enable') == "true")
                  f.favorite = (item.getAttribute('favorite') == "true")
                  f.ignore = (item.getAttribute('ignore') == "true")
                  f.name = item.getAttribute('name')
                  const common = item.querySelector("common")
                  f.enable_color = common.getAttribute("enableBg") == "true"
                  f.color = integerToTriples(+common.getAttribute("bg"))

                  f.ignore_case = item.querySelector("option").getAttribute("icase") == "true"

                  const base = item.querySelector("base")
                  f.base_search.search = base.querySelector("search").textContent
                  f.base_search.fields = toFields(base)

                  const and = item.querySelector("and")
                  f.and_search.enabled = (and.getAttribute("enable") == "true")
                  f.and_search.search = and.querySelector("search").textContent
                  f.and_search.fields = toFields(and)

                  const not = item.querySelector("not")
                  f.not_search.enabled = (not.getAttribute("enable") == "true")
                  f.not_search.search = not.querySelector("search").textContent
                  f.not_search.fields = toFields(not)

                  return f
              })

          ImportingFilters = filters
      } catch(e) {
          console.error(e)
          document.querySelector('#import_modal output').textContent = "Oops, something went wrong!"
          ImportingFilters = undefined
          document.querySelector('#import_modal #ok_button').disabled = true
          return
      }
      
      const toBeDeleted = {}
      for (const f of ImportingFilters)
          toBeDeleted[f.name] = true

      const num = Filters.filter(f => toBeDeleted[f.name]).length
      if (num > 0)
          document.querySelector('#import_modal output').textContent = `${num}{# existing filters will be replaced.}`
      else
          document.querySelector('#import_modal output').textContent = `${ImportingFilters.length}{# filters will be imported.}`

      document.querySelector('#import_modal #ok_button').disabled = false
  }

  async function onImportModalOk()
  {
      if (!ImportingFilters)
      {
          console.error("onImportModalOk: ImportingFilters is not set. Aborting.")
          return
      }

      const toBeDeleted = {}
      for (const f of ImportingFilters)
          toBeDeleted[f.name] = true

      let filters = Filters.filter(f => !toBeDeleted[f.name])
      Filters = filters.concat(ImportingFilters)

      document.getElementById('import_modal').style.display = 'none'
      renderFilterTable()
      await saveChannelFiltersAsync()
  }

</script>

<div id="flash"></div>

<div style="max-width: 640px">
  <div style="text-align: right; margin-bottom: 12px">
    <button onclick="onFilterResetAsync()"><span class="emoji-icon">&#x26a0;&#xfe0f;<!-- danger sign --></span> {#Reset}</button>
    <button onclick="document.getElementById('import_modal').style.display = 'block'; onFilterXmlInput()"><span class="emoji-icon">&#x2b06;&#xfe0f;<!-- up arrow  --></span> {#Import}</button>
  </div>
  <div id="filter_table"></div>
</div>

<div class="modal" id="filter_modal">
  <div class="modal-contents default-bg">
    <div class="modal-header">
      <h3 style="margin:0">{#Filter}</h3>
    </div>
    <div class="modal-body">
      <div style="float: right">
        <button onclick="onFilterModalDelete()">&#x1f5d1;&#xfe0f;<!-- wastebasket -->{#Delete}</button>
        <button onclick="onFilterModalReorder()">{#Reorder}</button>
      </div>
      <div id="info" align="left">
      </div>
    </div>
    <div class="modal-footer" style="margin-top:15px; text-align:right">
      <button onclick="onFilterModalOk()">{#OK}</button>
      <button onclick="document.getElementById('filter_modal').style.display = 'none'">{#Cancel}</button>
    </div>
  </div>
</div>

<div class="modal" id="reorder_modal">
  <div class="modal-contents default-bg">
    <div class="modal-header">
      <h3 style="margin:0">{#Reorder}</h3>
    </div>
    <div class="modal-body">
    </div>
    <div class="modal-footer" style="margin-top:15px; text-align:right">
      <button onclick="onReorderModalOk()">{#OK}</button>
      <button onclick="document.getElementById('reorder_modal').style.display = 'none'">{#Cancel}</button>
    </div>
  </div>
</div>

<div class="modal" id="import_modal">
  <div class="modal-contents default-bg">
    <div class="modal-header">
      <h3>{#Import Filters from PeCaRecorder}</h3>
    </div>
    <div class="modal-body" style="min-width:320">
      <div>
        <input id="filter_xml" type="file" accept="application/xml, .xml" oninput="onFilterXmlInput()">
      </div>
      <output></output>
    </div>
    <div class="modal-footer" style="margin-top:15px; text-align:right">
      <button id="ok_button" onclick="onImportModalOk()" disabled>{#OK}</button>
      <button onclick="document.getElementById('import_modal').style.display = 'none'">{#Cancel}</button>
    </div>
  </div>
</div>
